name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --dev --extra coding
      - run: uv run --extra coding ruff format --check .
      - run: uv run --extra coding ruff check .
      - run: uv run --extra coding pytest --cov=harnesslab --cov-report=term-missing --cov-fail-under=85
      - run: uv run --extra coding harnesslab run configs/smoke.yaml --fail-on-validation
