schema_version: '0.2'
id: rubric.contacts.holdout.03
revision: 1
category: structured_output
instruction: Normalize and deduplicate the supplied contacts. Trim and lowercase email
  addresses; deduplicate by normalized email; collapse whitespace in names; keep the
  first non-empty name and phone; retain only phone digits; lowercase, deduplicate,
  and sort tags; finally sort contacts by email. Return only JSON matching the supplied
  schema.
