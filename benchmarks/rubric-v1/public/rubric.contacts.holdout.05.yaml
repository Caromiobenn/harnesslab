schema_version: '0.2'
id: rubric.contacts.holdout.05
revision: 1
category: structured_output
instruction: Normalize and deduplicate the supplied contacts. Trim and lowercase email
  addresses; deduplicate by normalized email; collapse whitespace in names; keep the
  first non-empty name and phone; retain only phone digits; lowercase, deduplicate,
  and sort tags; finally sort contacts by email. Return only JSON matching the supplied
  schema.
input:
  contacts:
  - email: ' PERSON105-0@EXAMPLE.ORG '
    name: ' User  0 '
    phone: ''
    tags:
    - ' VIP '
    - alpha
  - email: person105-0@example.org
    name: User 0
    phone: (584)-58260
    tags:
    - vip
    - ' BETA '
  - email: ' PERSON105-1@EXAMPLE.ORG '
    name: ''
    phone: ''
    tags:
    - ' VIP '
    - alpha
  - email: person105-1@example.org
    name: User 1
    phone: (366)-74971
    tags:
    - vip
    - ' BETA '
  - email: ' PERSON105-2@EXAMPLE.ORG '
    name: ' User  2 '
    phone: ''
    tags:
    - ' VIP '
    - alpha
  - email: person105-2@example.org
    name: User 2
    phone: (717)-40936
    tags:
    - vip
    - ' BETA '
  - email: ' PERSON105-3@EXAMPLE.ORG '
    name: ''
    phone: ''
    tags:
    - ' VIP '
    - alpha
  - email: person105-3@example.org
    name: User 3
    phone: (542)-26611
    tags:
    - vip
    - ' BETA '
environment:
  toolset: null
  workspace: none
output_contract:
  mode: json
  schema_name: normalized-contacts.v1
  json_schema:
    type: object
    additionalProperties: false
    required:
    - contacts
    properties:
      contacts:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - email
          - name
          - phone
          - tags
          properties:
            email:
              type: string
              format: email
            name:
              type: string
            phone:
              type: string
              pattern: ^[0-9]*$
            tags:
              type: array
              items:
                type: string
              uniqueItems: true
limits:
  actor_model_calls: 12
  domain_tool_calls: 40
  wall_clock_seconds: 240
tags:
- contacts
- holdout
- generated-instance
- variant-3
