schema_version: '0.2'
id: rubric.invoice.dev.00
revision: 1
category: structured_output
instruction: Reconcile the invoice using decimal arithmetic. For every line, compute
  quantity times unit price after its percentage discount, then round that line to
  two decimals using ROUND_HALF_UP. Sum rounded line nets, calculate tax on the subtotal
  and round tax the same way. Sort output lines by id. Amounts must be strings with
  exactly two decimals. Status is paid when balance is at most zero, partial when
  some payment exists, otherwise unpaid. Return only JSON matching the supplied schema.
input:
  lines:
  - id: A
    quantity: 6
    unit_price: '5.555'
    discount_percent: 0
  - id: B
    quantity: 1
    unit_price: '1.005'
    discount_percent: 5
  tax_rate_percent: '0'
  payments:
  - '0.00'
environment:
  toolset: null
  workspace: none
output_contract:
  mode: json
  schema_name: invoice-reconciliation.v1
  json_schema:
    type: object
    additionalProperties: false
    required:
    - lines
    - subtotal
    - tax
    - total
    - paid
    - balance
    - status
    properties:
      lines:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - net
          properties:
            id:
              type: string
            net:
              type: string
              pattern: ^-?[0-9]+\.[0-9]{2}$
      subtotal:
        type: string
        pattern: ^-?[0-9]+\.[0-9]{2}$
      tax:
        type: string
        pattern: ^-?[0-9]+\.[0-9]{2}$
      total:
        type: string
        pattern: ^-?[0-9]+\.[0-9]{2}$
      paid:
        type: string
        pattern: ^-?[0-9]+\.[0-9]{2}$
      balance:
        type: string
        pattern: ^-?[0-9]+\.[0-9]{2}$
      status:
        enum:
        - paid
        - partial
        - unpaid
limits:
  actor_model_calls: 12
  domain_tool_calls: 40
  wall_clock_seconds: 240
tags:
- invoice
- dev
- generated-instance
- variant-0
