schema_version: "0.2"
experiment:
  name: benchmark-structured-baseline
  description: Two public/private structured-output cases against a local model server
  repeats: 1
  seed: 42
harness:
  kind: langchain_baseline
  model:
    provider: openai_compatible
    name: replace-with-served-model-name
    base_url: http://127.0.0.1:8000/v1
    api_key_env: null
    temperature: 0
    max_completion_tokens: 2048
    request_timeout_seconds: 60
    max_retries: 1
catalog: ../benchmarks/catalog-v0.2.yaml
output:
  directory: ../artifacts/benchmarks
