[project]
name = "harnesslab"
version = "0.1.0"
description = "Reproducible evaluation and diagnostics for long-horizon tool-using agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "HarnessLab contributors" },
]
dependencies = [
    "deepagents>=0.7.14,<0.8",
    "jsonschema>=4.25,<5",
    "langchain-openai>=1.6.2,<2",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
harnesslab = "harnesslab.cli:main"
harnesslab-coding = "harnesslab.coding.cli:main"

[project.optional-dependencies]
coding = [
    "harbor[e2b]==0.25.0",
    "e2b==2.62.1",
    "mini-swe-agent==2.4.6+fc.1",
    "litellm==1.106.6",
    "mcp==2.3.0",
    "langchain-deepseek>=1.0,<2",
    "python-dotenv>=1.0,<2",
]

[tool.uv.sources]
mini-swe-agent = { path = "vendor/wheels/mini_swe_agent-2.4.6+fc.1-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harnesslab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["vendor", "scripts/benchmark_http_cache.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
