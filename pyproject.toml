[project]
name = "harnesslab"
version = "0.1.0"
description = "Reproducible evaluation and diagnostics for long-horizon tool-using agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "HarnessLab contributors" },
]
dependencies = [
    "deepagents>=0.7.14,<0.8",
    "jsonschema>=4.25,<5",
    "langchain-openai>=1.6.2,<2",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
harnesslab = "harnesslab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harnesslab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
